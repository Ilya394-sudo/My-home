<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY HOME — Детский телеканал</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a192f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
            border-bottom: 2px solid #1e3a5f;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 2rem; letter-spacing: 2px; font-weight: 700; color: #ffffff; }
        .header h1 span { color: #ffd700; }
        .clock {
            background-color: #1e3a5f;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffd700;
        }
        .main-container { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 30px; }
        .player-section {
            background-color: #112240;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            border: 1px solid #1e3a5f;
        }
        .player-title { font-size: 1.4rem; margin-bottom: 15px; color: #ffd700; text-align: center; }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background-color: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .schedule-container {
            background-color: #112240;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            border: 1px solid #1e3a5f;
        }
        .schedule-title { text-align: center; font-size: 1.5rem; margin-bottom: 20px; color: #a0c4ff; font-weight: 600; }
        .schedule-table { width: 100%; border-collapse: collapse; font-size: 1rem; }
        .schedule-table th {
            background-color: #1e3a5f;
            color: #fff;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            border-bottom: 2px solid #2a4a7a;
        }
        .schedule-table td { padding: 12px 15px; border-bottom: 1px solid #1e3a5f; }
        .time-cell { font-weight: 700; color: #ffd700; min-width: 130px; }
        .show-cell { font-weight: 500; }
        .status {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            min-width: 80px;
            text-align: center;
        }
        .status.active { background-color: #ff6b6b; color: white; }
        .status.upcoming { background-color: #2a4a7a; color: #a0c4ff; }
        .status.ended { background-color: #1a2f4a; color: #5a7a9a; }
        
        /* АРХИВ */
        .archive-container {
            background-color: #0d1a2d;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #2a4a7a;
        }
        .archive-title { text-align: center; font-size: 1.5rem; margin-bottom: 20px; color: #ffd700; font-weight: 600; }
        
        /* Стили для ЛОГОТИПА-КАРТИНКИ как заголовка архива */
        .archive-logo-wrapper {
            background-color: #0d1a2d; /* Темно-синий фон как у всего архива */
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            border: 2px dashed #2a4a7a; /* Пунктирная рамка чтобы выделить */
        }
        .archive-logo-img {
            max-width: 100%;
            height: auto;
            max-height: 150px; /* Максимальная высота логотипа */
            display: inline-block;
            
            /* Хитрость: делаем белый фон картинки прозрачным, чтобы смешался с синим */
            mix-blend-mode: screen; 
            filter: brightness(1.1) drop-shadow(0 0 8px rgba(0, 0, 0, 0.8));
        }
        
        .archive-list { list-style: none; padding: 0; }
        .archive-list li {
            background-color: #1a2f4a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .archive-info { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
        .archive-info .archive-name { font-weight: 700; font-size: 1rem; }
        .archive-info .archive-time { color: #5a7a9a; font-size: 0.8rem; }
        
        .btn-play-archive {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .btn-play-archive:hover {
            background-color: #ff4444;
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255,107,107,0.4);
        }
        .btn-play-archive:active {
            transform: scale(0.95);
        }
        
        .footer { margin-top: 25px; font-size: 0.85rem; color: #5a7a9a; text-align: center; padding: 15px; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .header h1 { font-size: 1.5rem; }
            .schedule-table { font-size: 0.85rem; }
            .time-cell { min-width: 90px; font-size: 0.8rem; }
            .clock { font-size: 1rem; padding: 8px 15px; }
            .btn-play-archive { padding: 10px 15px; font-size: 0.8rem; }
            .archive-list li { padding: 12px; }
            .archive-logo-img { max-height: 100px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>MY <span>HOME</span> 📺</h1>
        <div class="clock" id="clock">00:00:00</div>
    </div>

    <div class="main-container">
        <div class="player-section" id="playerSection">
            <div class="player-title" id="playerTitle">⏳ Ожидание эфира...</div>
            <div class="video-container" id="videoContainer">
                <iframe id="videoFrame" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <div class="schedule-container">
            <div class="schedule-title">📅 Расписание эфира</div>
            <table class="schedule-table">
                <thead><tr><th>Время</th><th>Мультфильм</th><th>Статус</th></tr></thead>
                <tbody id="scheduleBody"></tbody>
            </table>
        </div>

        <div class="archive-container">
            <!-- ЛОГОТИП КАК ЗАГОЛОВОК АРХИВА, ПО ЦЕНТРУ, НА ТЕМНО-СИНЕМ ФОНЕ -->
            <div class="archive-logo-wrapper">
                <img src="logo.png" alt="APXMR Архив" class="archive-logo-img">
            </div>
            
            <ul class="archive-list" id="archiveList">
                <li style="color:#5a7a9a; justify-content:center;">Здесь появятся мультфильмы после показа</li>
            </ul>
        </div>
    </div>

    <div class="footer">MY HOME • Телеканал для детей</div>

    <script>
        var schedule = [
            { start: { h: 6, m: 0 }, end: { h: 7, m: 0 }, title: "Ум и Хрум", oid: "-222323218", id: "456239252" },
            { start: { h: 7, m: 0 }, end: { h: 8, m: 0 }, title: "Царевны", oid: "-117945886", id: "456240677" },
            { start: { h: 8, m: 0 }, end: { h: 9, m: 0 }, title: "Лео и Тиг", oid: "-40367885", id: "456244016" },
            { start: { h: 9, m: 0 }, end: { h: 9, m: 24 }, title: "Аркадий Паровозов (1)", oid: "-40367885", id: "456243361" },
            { start: { h: 9, m: 24 }, end: { h: 9, m: 48 }, title: "Аркадий Паровозов (2)", oid: "-40367885", id: "456243704" },
            { start: { h: 9, m: 48 }, end: { h: 10, m: 12 }, title: "Аркадий Паровозов (3)", oid: "-196938724", id: "456239060" },
            { start: { h: 10, m: 12 }, end: { h: 10, m: 18 }, title: "Лунтик (1)", oid: "-49620997", id: "456241389" },
            { start: { h: 10, m: 18 }, end: { h: 10, m: 24 }, title: "Лунтик (2)", oid: "-49620997", id: "456241640" },
            { start: { h: 10, m: 24 }, end: { h: 10, m: 30 }, title: "Лунтик (3)", oid: "-49620997", id: "456241388" },
            { start: { h: 10, m: 30 }, end: { h: 10, m: 36 }, title: "Лунтик (4)", oid: "-49620997", id: "456241606" },
            { start: { h: 10, m: 36 }, end: { h: 10, m: 42 }, title: "Лунтик (5)", oid: "-49620997", id: "456241340" },
            { start: { h: 10, m: 42 }, end: { h: 10, m: 48 }, title: "Лунтик (6)", oid: "-235114742", id: "456239137" },
            { start: { h: 10, m: 48 }, end: { h: 10, m: 54 }, title: "Лунтик (7)", oid: "-49620997", id: "456241629" },
            { start: { h: 10, m: 54 }, end: { h: 11, m: 0 }, title: "Лунтик (8)", oid: "-49620997", id: "456241610" },
            { start: { h: 11, m: 0 }, end: { h: 12, m: 0 }, title: "Щенячий патруль", oid: "-191195780", id: "456243639" },
            { start: { h: 12, m: 0 }, end: { h: 13, m: 0 }, title: "Медведь Валера", oid: "-53325318", id: "456239936" },
            { start: { h: 13, m: 0 }, end: { h: 14, m: 0 }, title: "Малышарики", oid: "-106614704", id: "456240934" },
            { start: { h: 14, m: 0 }, end: { h: 15, m: 0 }, title: "Сказочный патруль", oid: "-131738248", id: "456239996" },
            { start: { h: 15, m: 0 }, end: { h: 16, m: 0 }, title: "Маша и Медведь", oid: "-22277933", id: "456239401" },
            { start: { h: 16, m: 0 }, end: { h: 17, m: 0 }, title: "Фиксики", oid: "-133569542", id: "456239019" },
            { start: { h: 17, m: 0 }, end: { h: 18, m: 0 }, title: "Смешарики", oid: "-21665793", id: "456243351" },
            { start: { h: 18, m: 0 }, end: { h: 19, m: 0 }, title: "Белка и Стрелка", oid: "-24738313", id: "456270383" },
            { start: { h: 19, m: 0 }, end: { h: 19, m: 30 }, title: "Колыбельные", oid: "-229807497", id: "456239177" }
        ];

        var archive = [];
        var currentVideoKey = null;

        function pad(n){return String(n).padStart(2,'0')}
        function timeToMinutes(h,m){return h*60+m}
        function formatTime(h,m){return pad(h)+":"+pad(m)}

        function updateClock(){
            var now = new Date();
            document.getElementById('clock').textContent = pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
        }
        setInterval(updateClock, 1000);
        updateClock();

        function buildSchedule(){
            var html = '';
            schedule.forEach(function(item){
                var id = item.title.replace(/\s+/g,'-');
                html += '<tr><td class="time-cell">'+formatTime(item.start.h,item.start.m)+' – '+formatTime(item.end.h,item.end.m)+'</td><td class="show-cell">'+item.title+'</td><td><span class="status upcoming" id="status-'+id+'">Ожидание</span></td></tr>';
            });
            document.getElementById('scheduleBody').innerHTML = html;
        }
        buildSchedule();

        function updateArchive(){
            var list = document.getElementById('archiveList');
            if(archive.length === 0){
                list.innerHTML = '<li style="color:#5a7a9a; justify-content:center;">Здесь появятся мультфильмы после показа</li>';
                return;
            }
            var html = '';
            for(var i = archive.length - 1; i >= 0; i--){
                var item = archive[i];
                html += '<li>' +
                    '<span class="archive-info">' +
                        '<span class="archive-name">' + item.title + '</span>' +
                        '<span class="archive-time">Показан в ' + item.time + '</span>' +
                    '</span>' +
                    '<button class="btn-play-archive" onclick="playFromArchive(\'' + item.oid + '\',\'' + item.id + '\',\'' + item.title + '\')">▶ Смотреть</button>' +
                '</li>';
            }
            list.innerHTML = html;
        }

        function moveToArchive(item){
            var now = new Date();
            var timeStr = pad(now.getHours())+':'+pad(now.getMinutes());
            archive.push({ title: item.title, time: timeStr, oid: item.oid, id: item.id });
            var index = schedule.indexOf(item);
            if(index !== -1) schedule.splice(index, 1);
            updateArchive();
            buildSchedule();
        }

        function playVideo(item){
            var videoKey = item.oid + '_' + item.id;
            if(currentVideoKey === videoKey) return;
            currentVideoKey = videoKey;
            
            document.getElementById('playerTitle').textContent = '▶ Сейчас идёт: ' + item.title;
            
            var container = document.getElementById('videoContainer');
            container.innerHTML = '<iframe src="https://vkvideo.ru/video_ext.php?oid=' + item.oid + '&id=' + item.id + '&autoplay=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
            
            schedule.forEach(function(s){
                var id = s.title.replace(/\s+/g,'-');
                var el = document.getElementById('status-'+id);
                if(s.title === item.title){
                    el.textContent = '▶ Идёт';
                    el.className = 'status active';
                }
            });
        }

        function playFromArchive(oid, id, title){
            currentVideoKey = oid + '_' + id;
            
            document.getElementById('playerTitle').textContent = '▶ Смотрю из архива: ' + title;
            
            var container = document.getElementById('videoContainer');
            container.innerHTML = '<iframe src="https://vkvideo.ru/video_ext.php?oid=' + oid + '&id=' + id + '&autoplay=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
            
            document.getElementById('playerSection').scrollIntoView({ behavior: 'smooth' });
        }

        function checkSchedule(){
            var now = new Date();
            var nowMinutes = timeToMinutes(now.getHours(), now.getMinutes());
            
            for(var i = schedule.length - 1; i >= 0; i--){
                var item = schedule[i];
                var end = timeToMinutes(item.end.h, item.end.m);
                if(nowMinutes >= end){
                    moveToArchive(item);
                }
            }
            
            for(var j = 0; j < schedule.length; j++){
                var current = schedule[j];
                var start = timeToMinutes(current.start.h, current.start.m);
                var end2 = timeToMinutes(current.end.h, current.end.m);
                
                if(nowMinutes >= start && nowMinutes < end2){
                    playVideo(current);
                    return;
                }
            }
            
            currentVideoKey = null;
            document.getElementById('playerTitle').textContent = '⏸ Эфир завершён';
            document.getElementById('videoContainer').innerHTML = '';
        }
        
        checkSchedule();
        setInterval(checkSchedule, 10000);
    </script>

</body>
</html>
